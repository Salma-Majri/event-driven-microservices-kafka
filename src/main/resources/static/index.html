<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Analytics - Real-time Kafka Streams</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/smoothie/1.34.0/smoothie.min.js"></script>
</head>
<body>

<h1>Real-time Analytics (Kafka Streams)</h1>
<canvas id="chart2" width="600" height="400"></canvas>

<script>
    var index = -1;
    var colors = [
        { stroke: 'rgba(0, 255, 0, 1)', fill: 'rgba(0, 255, 0, 0.2)' },
        { stroke: 'rgba(255, 0, 0, 1)', fill: 'rgba(255, 0, 0, 0.2)' }
    ];

    function randomColor() {
        ++index;
        if (index >= colors.length) index = 0;
        return colors[index];
    }

    var pages = ["P1", "P2"];
    var courbe = [];

    var smoothieChart = new SmoothieChart({ tooltip: true });
    smoothieChart.streamTo(document.getElementById("chart2"), 500);

    pages.forEach(function(v) {
        courbe[v] = new TimeSeries();
        var col = randomColor();
        smoothieChart.addTimeSeries(courbe[v], {
            strokeStyle: col.stroke,
            fillStyle: col.fill,
            lineWidth: 2
        });
    });

    var stockEventSource = new EventSource("/analytics");

    stockEventSource.onmessage = function (event) {
        var data = JSON.parse(event.data);
        var timestamp = new Date().getTime();

        pages.forEach(function(v) {
            var val = data[v] ? data[v] : 0;
            courbe[v].append(timestamp, val);
        });
    };
</script>

</body>
</html>
